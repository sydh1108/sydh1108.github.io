# Supabase 무료 프로젝트는 1주일 동안 활동이 없으면 일시정지돼요.
# 사흘마다 데이터베이스에 가벼운 조회를 한 번 보내서 깨어 있게 해요.
# shortcut: GitHub는 저장소에 60일 동안 커밋이 없으면 예약 실행을 멈춰요(메일로 알려 줘요). 그때는 Actions 탭에서 다시 켜면 돼요.
name: Supabase 깨우기
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 데이터베이스에 조회 한 번 보내기
        run: |
          KEY=$(grep -o 'eyJ[^"]*' config.js)
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/docs?select=id&limit=1")
          echo "응답: $code"
          test "$code" = "200"
